name: tabbit-deploy
run-name: Running
on:
  push:
    branches: 
      - develop

jobs:
  build:

    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5 # v3.1.0

      - name: Build with Gradle Wrapper
        run: ./gradlew build -x test

      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: 2222
          source: "build/libs/*.jar"
          target: "/home/ubuntu/tabbit-backend/"
          debug: true

      - name: Stop current application
        uses: appleboy/ssh-action@v0.1.1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: 2222
          script: |
            screen -dmS stop_app bash -c 'pkill -f "java -jar" || true'

      - name: Backup current JAR
        uses: appleboy/ssh-action@v0.1.1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: 2222
          script: |
            screen -dmS backup_jar bash -c 'mv /home/ubuntu/tabbit-backend/build/libs/app.jar /home/ubuntu/tabbit-backend/build/libs/app_backup.jar || true'

      - name: Deploy new JAR
        uses: appleboy/ssh-action@v0.1.1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: 2222
          script: |
            screen -dmS deploy_jar bash -c 'mv /home/ubuntu/tabbit-backend/build/libs/tabbit.jar /home/ubuntu/tabbit-backend/build/libs/app.jar'

      - name: Start new application
        uses: appleboy/ssh-action@v0.1.1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: 2222
          script: |
            nohup java -jar -Duser.timezone=Asia/Seoul /home/ubuntu/tabbit-backend/build/libs/app.jar --spring.config.location=/home/ubuntu/tabbit-backend/application.yaml > /home/ubuntu/tabbit-backend/app.log 2>&1 &

      - name: Cleanup old backups
        uses: appleboy/ssh-action@v0.1.1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: 2222
          script: |
            screen -dmS cleanup bash -c 'find /home/ubuntu/tabbit-backend/build/libs/ -name "app_backup.jar" -mtime +1 -exec rm {} \;'
