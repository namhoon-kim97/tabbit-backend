name: tabbit-deploy
run-name: Running
on:
  push:
    branches:
      - develop

jobs:
  build:

    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:

      # 1. 코드 체크아웃
      - uses: actions/checkout@v4

      # 2. JDK 17 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. gradlew 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 4. Gradle 환경 설정
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5 # v3.1.0

      - name: Create application.yaml from Secret
        run: |
          mkdir -p src/main/resources
          printf '%s' "${{ secrets.APPLICATION_YAML }}" > src/main/resources/application.yml

      - name: Create firebase .json from Secret
        run: |
          mkdir -p src/main/resources/firebase
          printf '%s' "${{ secrets.FIREBASE_JSON }}" > src/main/resources/firebase/tabbit-69517-firebase-adminsdk-fbsvc-91f92182cc.json
      - name: Check created files
        run: |
          ls -R src/main/resources

      # 7. Gradle 빌드 (테스트 제외)
      - name: Build with Gradle Wrapper
        run: ./gradlew build -x test

      # 8. 서버에 application.yaml + firebase .json 복사
      - name: Copy config files (application.yaml + firebase json) via SCP
        uses: appleboy/scp-action@v0.1.1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: 2222
          source: |
            ./src/main/resources/application.yml
            ./src/main/resources/firebase/tabbit-69517-firebase-adminsdk-fbsvc-91f92182cc.json
          target: "/home/ubuntu/tabbit-backend/"
          debug: true

      # 9. 서버에 JAR 파일 복사
      - name: Copy JAR via SCP
        uses: appleboy/scp-action@v0.1.1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: 2222
          source: "build/libs/*.jar"
          target: "/home/ubuntu/tabbit-backend/"
          debug: true

      # 10. 기존 애플리케이션 종료
      - name: Stop current application
        uses: appleboy/ssh-action@v0.1.1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: 2222
          script: |
            screen -dmS stop_app bash -c 'pkill -f "java -jar" || true'

      # 11. 현재 JAR 백업
      - name: Backup current JAR
        uses: appleboy/ssh-action@v0.1.1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: 2222
          script: |
            screen -dmS backup_jar bash -c 'mv /home/ubuntu/tabbit-backend/build/libs/app.jar /home/ubuntu/tabbit-backend/build/libs/app_backup.jar || true'

      # 12. 새 JAR 배포
      - name: Deploy new JAR
        uses: appleboy/ssh-action@v0.1.1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: 2222
          script: |
            screen -dmS deploy_jar bash -c 'mv /home/ubuntu/tabbit-backend/build/libs/tabbit.jar /home/ubuntu/tabbit-backend/build/libs/app.jar'

      # 13. 애플리케이션 시작
      - name: Start new application
        uses: appleboy/ssh-action@v0.1.1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: 2222
          script: |
            nohup java -jar -Duser.timezone=Asia/Seoul /home/ubuntu/tabbit-backend/build/libs/app.jar --spring.config.location=/home/ubuntu/tabbit-backend/application.yaml > /home/ubuntu/tabbit-backend/app.log 2>&1 &

      # 14. 오래된 백업 삭제
      - name: Cleanup old backups
        uses: appleboy/ssh-action@v0.1.1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: 2222
          script: |
            screen -dmS cleanup bash -c 'find /home/ubuntu/tabbit-backend/build/libs/ -name "app_backup.jar" -mtime +1 -exec rm {} \;'
